# SPDX-License-Identifier: Apache-2.0
# A paused ARM64 host connected to QEMU's edu device through vfio-user.
version: 1
imports:
  - hosts/qemu.yaml
  - hosts/tcg-aarch64.yaml
  - devices/pci/qemu-edu.yaml
machines:
  - id: m0
    host:
      use: tcg-aarch64
      runtime: {binary: ../../qemu/build/qemu-system-aarch64}
    devices:
      - {id: edu, use: qemu-edu-aarch64}
