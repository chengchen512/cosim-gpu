# SPDX-License-Identifier: Apache-2.0
# A paused ARM64 host connected to QEMU's edu device through vfio-user.
version: 1
imports:
  - hosts/qemu.yaml
  - hosts/host-arm-tcg.yaml
  - devices/pci/qemu-edu.yaml
machines:
  - id: m0
    host:
      use: host-arm-tcg
      runtime: {binary: build/qemu/qemu-system-aarch64}
    devices:
      - {id: edu, use: qemu-edu-aarch64}
