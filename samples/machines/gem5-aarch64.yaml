# Paused ARM64 host with one native ARM64 gem5 MI300X process.
version: 1
imports:
  - hosts/qemu.yaml
  - hosts/tcg-aarch64.yaml
  - devices/gpu/mi300x.yaml
machines:
  - id: m0
    host:
      use: tcg-aarch64
      runtime: {binary: ../../qemu/build/qemu-system-aarch64}
      memory: 512M
    devices:
      - use: mi300x-aarch64
        id: gpu0
        memory_regions: [{name: vram, size: 1G}]
        args: {num_compute_units: 4}
