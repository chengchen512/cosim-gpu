# A paused x86_64 host connected to QEMU's edu device through vfio-user.
version: 1
imports:
  - hosts/qemu.yaml
  - hosts/tcg.yaml
  - devices/pci/qemu-edu.yaml
machines:
  - id: m0
    host:
      use: tcg
      runtime: {binary: ../../qemu/build/qemu-system-x86_64}
    devices:
      - {use: qemu-edu}
