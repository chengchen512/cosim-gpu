# SPDX-License-Identifier: Apache-2.0
# A paused x86_64 host connected to QEMU's edu device through vfio-user.
version: 1
imports:
  - hosts/qemu.yaml
  - hosts/host-x86-tcg.yaml
  - devices/pci/qemu-edu.yaml
machines:
  - id: m0
    host:
      use: host-x86-tcg
      runtime: {binary: build/qemu/qemu-system-x86_64}
    devices:
      - {use: qemu-edu}
