version: 1
kinds:
  qemu-host:
    role: host
    model: qemu
    # Each device gets a PCIe root port at slots 0x10-0x17, eight functions each.
    max_devices: 64
    command: |
      {% set ns = namespace(argv=[
        "-machine", host.machine ~ ",memory-backend=ram",
        "-accel", host.accel,
        "-m", (ram.size | string) ~ "B",
        "-smp", host.cpus | string,
        "-object", {"qom-type": "memory-backend-file", "id": "ram",
          "size": ram.size, "mem-path": pool, "offset": ram.offset,
          "share": true} | tojson,
        "-qmp", "unix:" ~ (qmp | replace(",", ",,")) ~ ",server=on,wait=off",
        "-chardev", "socket,id=serial0,path=" ~ (serial | replace(",", ",,"))
          ~ ",server=on,wait=off,logfile=" ~ (serial_log | replace(",", ",,"))
          ~ ",logappend=off",
        "-serial", "chardev:serial0"
      ]) %}
      {% for flag, value in [("-cpu", host.cpu), ("-display", host.display),
          ("-monitor", host.monitor), ("-append", cmdline)] %}
        {% if value %}{% set ns.argv = ns.argv + [flag, value] %}{% endif %}
      {% endfor %}
      {% if boot %}
        {% set ns.argv = ns.argv + ["-kernel", boot.kernel] %}
        {% if boot.initrd %}
          {% set ns.argv = ns.argv + ["-initrd", boot.initrd] %}
        {% endif %}
      {% endif %}
      {% if host.no_reboot %}{% set ns.argv = ns.argv + ["-no-reboot"] %}{% endif %}
      {# Root ports take their fixed slots before disks receive free ones. #}
      {% for device in devices %}
        {% set port = "rp" ~ loop.index0 %}
        {% set client = {"driver": "vfio-user-pci", "bus": port,
          "socket": {"type": "unix", "path": device.socket}} %}
        {% if device.pci.rom %}
          {% set client = dict(client, romfile=device.pci.rom) %}
        {% endif %}
        {% set ns.argv = ns.argv + [
          "-device", {"driver": "pcie-root-port", "id": port, "bus": "pcie.0",
            "chassis": loop.index, "port": loop.index0,
            "addr": "1" ~ (loop.index0 // 8) ~ "." ~ (loop.index0 % 8),
            "multifunction": loop.index0 % 8 == 0} | tojson,
          "-device", client | tojson
        ] %}
      {% endfor %}
      {% if disks | selectattr("bus", "equalto", "scsi") | list %}
        {% set ns.argv = ns.argv + ["-device", "virtio-scsi-pci,id=scsi"] %}
      {% endif %}
      {% set drivers = {"virtio": "virtio-blk-pci", "nvme": "nvme",
          "scsi": "scsi-hd", "ide": "ide-hd"} %}
      {% for disk in disks %}
        {% set file_node = "file-" ~ loop.index0 %}
        {% set disk_node = "disk-" ~ loop.index0 %}
        {% set ns.argv = ns.argv + [
          "-blockdev", {"driver": "file", "filename": disk.path,
            "node-name": file_node, "read-only": disk.readonly} | tojson,
          "-blockdev", {"driver": disk.format, "file": file_node,
            "node-name": disk_node, "read-only": disk.readonly} | tojson
        ] %}
        {% set fields = {"driver": drivers[disk.bus], "drive": disk_node} %}
        {% if disk.bus == "nvme" %}
          {% set fields = dict(fields, serial=machine ~ "-" ~ disk.id) %}
        {% endif %}
        {% if disk.boot %}{% set fields = dict(fields, bootindex=1) %}{% endif %}
        {% set ns.argv = ns.argv + ["-device", fields | tojson] %}
      {% endfor %}
      {{ (ns.argv + host.args) | tojson }}
templates:
  qemu-host:
    kind: qemu-host
    display: none
    monitor: none
    no_reboot: true
  host-x86:
    use: qemu-host
    machine: q35
    runtime:
      binary: build/qemu/qemu-system-x86_64
    memory: 8G
    cpus: 4
    accel: kvm
    cpu: host
    memory_map: |
      {% set limit = 2147483648 if ram.size >= 2952790016 else 2952790016 %}
      {% set low = [ram.size, limit] | min %}
      {% set ranges = [{"start": 0, "size": low}] %}
      {% if ram.size > low %}
        {% set ranges = ranges + [{"start": 4294967296, "size": ram.size - low}] %}
      {% endif %}
      {{ ranges | tojson }}
  host-arm:
    use: qemu-host
    machine: virt,gic-version=3
    runtime:
      binary: build/qemu/qemu-system-aarch64
    memory: 8G
    cpus: 4
    accel: kvm
    cpu: host
    memory_map: '[{"start": 1073741824, "size": {{ ram.size }} }]'
