# Compile verification for gem5 (push to main + manual)
name: Build

on:
  push:
    branches: [main]
    paths:
      - 'gem5'
      - '.gitmodules'
      - 'scripts/Dockerfile.run'
      - '.github/workflows/build.yml'
      - 'justfile'
  pull_request:
    branches: [main]
    paths:
      - 'gem5'
      - '.gitmodules'
      - 'scripts/Dockerfile.run'
      - 'justfile'
      - '.github/workflows/build.yml'
  workflow_dispatch:

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-gem5:
    name: Build gem5 (VEGA_X86)
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Init gem5 submodule
        run: |
          git config --global url."https://github.com/".insteadOf "git@github.com:"
          git submodule update --init --recursive --depth 1 gem5

      - uses: extractions/setup-just@v4
        with:
          just-version: 1.51.0

      - name: Build gem5
        run: just build-gem5 "$(nproc)" GOLD_LINKER=True --linker=gold

      - name: Verify binary
        run: test -f "gem5/$(just --evaluate gem5_build_dir)/gem5.opt"
