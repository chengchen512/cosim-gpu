# SPDX-License-Identifier: Apache-2.0
name: Integration

on:
  workflow_call:
    inputs:
      runtime-artifact:
        description: Immutable artifact ID produced by the build job
        required: true
        type: string
      guest-artifact:
        description: Immutable paired kernel/disk artifact ID
        required: true
        type: string
      image-key:
        description: Exact image inputs requested by the current producer
        required: true
        type: string

permissions:
  contents: read
  actions: read

jobs:
  cosim-full-test:
    name: Full ROCm guest regression
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    env:
      COSIM_ENV: container
      COSIM_DEV_IMAGE: cosim-dev:ci
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - uses: extractions/setup-just@v4
        with:
          just-version: 1.51.0

      - name: Check KVM
        run: |
          test "$(uname -m)" = x86_64
          test -c /dev/kvm
          sudo chmod a+rw /dev/kvm

      - name: Initialize simulator sources
        run: |
          git config --global url."https://github.com/".insteadOf "git@github.com:"
          git submodule update --init --depth 1 gem5 qemu gem5-resources
          git -C gem5 submodule update --init --recursive --depth 1

      - uses: actions/download-artifact@v4
        with:
          artifact-ids: ${{ inputs.runtime-artifact }}
          path: artifacts/ci-build
          merge-multiple: true

      - name: Restore verified gem5 and development image
        run: just ci-restore artifacts/ci-build

      - name: Verify competing session memory reservations
        run: just test-cosim-memory

      - name: Test the restored MI300X model
        run: just test-gem5-mi300x artifacts/rocm-regression/model

      - uses: actions/download-artifact@v4
        with:
          artifact-ids: ${{ inputs.guest-artifact }}
          path: artifacts/rocm-assets
          merge-multiple: true

      - name: Verify the paired disk, kernel and package manifest
        env:
          IMAGE_KEY: ${{ inputs.image-key }}
        run: just ci-verify-rocm-artifact artifacts/rocm-assets "$IMAGE_KEY"

      - name: Build QEMU and Rust launcher
        run: |
          just build-qemu
          just build-cosim

      - name: Verify vfio-user option ROM exposure
        run: just test-cosim-vfio-user

      - name: Run ROCm workloads through the Rust launcher
        run: just test-rocm-ci artifacts/rocm-regression/guest artifacts/rocm-assets

      - name: Upload complete regression evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: rocm-regression-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            artifacts/rocm-regression/
            artifacts/rocm-assets/manifest.json
            artifacts/ci-build/manifest.json
            !artifacts/rocm-regression/**/*.sock
          if-no-files-found: warn
          retention-days: 14
