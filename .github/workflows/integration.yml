# Full vfio-user co-simulation test on a KVM-capable runner
name: Integration

on:
  workflow_dispatch:

concurrency:
  group: integration-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Full cosim test (QEMU + gem5 + disk image)
  # Requires self-hosted runner with: KVM, Docker, pre-built disk image
  cosim-full-test:
    name: Full Cosim Test
    runs-on: [self-hosted, kvm]
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 1

      - name: Verify prerequisites
        run: |
          test -e /dev/kvm || { echo "::error::KVM not available"; exit 1; }
          command -v docker || { echo "::error::Docker not found"; exit 1; }
          echo "KVM and Docker available"

      - uses: extractions/setup-just@v4
        with:
          just-version: 1.51.0

      - name: Build images
        run: just docker-image

      - name: Run cosim integration tests
        run: just test --all

      - name: Upload test logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cosim-full-test-logs
          path: /tmp/qemu-cosim-tests*.log
          retention-days: 14
