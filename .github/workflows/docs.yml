# SPDX-License-Identifier: Apache-2.0
name: Docs

on:
  push:
    branches: [main]
    paths:
      - "docs/**"
      - "justfile"
      - "README.md"
      - "README.zh.md"
      - ".github/workflows/docs.yml"
  pull_request:
    paths:
      - "docs/**"
      - "justfile"
      - "README.md"
      - "README.zh.md"
      - ".github/workflows/docs.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: docs-pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: false

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: docs/requirements.txt

      - name: Install documentation toolchain
        run: python -m pip install -r docs/requirements.txt

      - name: Check documentation format
        run: docs/scripts/check_format.sh

      - name: Build documentation (zh primary, en mirror)
        env:
          COSIM_DOCS_BASEURL: https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}/
        run: docs/scripts/build.sh

      - name: Check bilingual parity
        run: docs/scripts/check_i18n.py

      - name: Verify generated site
        run: docs/scripts/verify_build.py

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: docs/_build/html

  deploy:
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
