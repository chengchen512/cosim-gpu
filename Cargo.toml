# SPDX-License-Identifier: Apache-2.0
[workspace]
members = ["crates/cosim-topology"]
resolver = "3"

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "Apache-2.0"
rust-version = "1.95"

[workspace.dependencies]
cosim-topology = { path = "crates/cosim-topology" }
anyhow = "1"
minijinja = { version = "2", features = ["json"] }
parse-size = "1"
schemars = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_yaml_ng = "0.10"
tempfile = "3"

[workspace.lints.rust]
unsafe_code = "forbid"
